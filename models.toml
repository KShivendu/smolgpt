# smolgpt model registry.
#
# The `--serve` web UI reads this file to learn which trained .bin models live
# in the project root, what architecture/tokenizer each one was saved with,
# which dataset it was trained on, and how to evaluate it. Add a new
# [[model]] table for every model you want visible in the UI.
#
# Required fields per [[model]]:
#   id            - unique slug, used in URL paths (/api/models/<id>/eval)
#   path          - .bin file, relative to the project root
#   model_type    - "gpt" | "bigram"
#   tokenizer     - "char" | "bpe"
#   vocab_size    - tokenizer vocab size (used only when tokenizer = "bpe")
#   block_size    - context window the model was trained with
#   hidden_size   - embedding dimension
#   num_heads     - attention heads
#   num_blocks    - transformer blocks
#   dataset       - path to the training corpus (relative to project root)
#   dataset_name  - human-friendly dataset label shown in the UI
#   eval_min      - inclusive lower bound for eval operands
#   eval_max      - inclusive upper bound for eval operands
#   eval_samples  - number of held-out problems the eval endpoint runs
#   note          - free-text description shown on the model card
#
# If a model fails to load with its registered arch/tokenizer, the UI marks it
# `status = "mismatch"` and prints a warning to the server log. Edit the fields
# here to match the saved checkpoint and restart `--serve`.

[[model]]
id = "gpt-arithmetic-1digit"
path = "gpt-arithmetic-1digit.bin"
model_type = "gpt"
tokenizer = "char"
vocab_size = 1024
block_size = 32
hidden_size = 32
num_heads = 8
num_blocks = 6
dataset = "data/arithmetic-1digit.txt"
dataset_name = "arithmetic-1digit"
eval_min = 0
eval_max = 9
eval_samples = 200
note = "78K params, 1-digit operands 0-9, 2000 epochs, 7.5% greedy correct."

