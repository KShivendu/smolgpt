[package]
name = "smolgpt"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
candle-core = "0.9.1"
candle-nn = "0.9.1"
clap = { version = "4.5.45", features = ["derive"] }
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.15"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"

[dev-dependencies]
rstest = "0.26.1"
temp-dir = "0.1.16"

[profile.dev]
debug = true

