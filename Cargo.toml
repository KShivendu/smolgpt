[package]
name = "smolgpt"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
candle-core = "0.9.1"
candle-nn = "0.9.1"
clap = { version = "4.5.45", features = ["derive"] }
rand = "0.9.2"
rusqlite = { version = "0.39", features = ["bundled"] }
# Pin libsqlite3-sys to 0.37 (pre-cfg_select!) — 0.38+ requires nightly Rust.
# Rust 1.94 stable doesn't have cfg_select! stabilized (rust-lang/rust#115585),
# so rusqlite 0.40 / libsqlite3-sys 0.38 won't compile. Re-evaluate when
# cfg_select! lands on stable.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.15"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"

[dev-dependencies]
rstest = "0.26.1"
temp-dir = "0.1.16"

[profile.dev]
debug = true

