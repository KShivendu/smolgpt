[project]
name = "smolgpt"
version = "0.1.0"
description = "A smol GPT/bigram language model in PyTorch (Python port of the Rust smolgpt)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
]

[project.scripts]
smolgpt = "smolgpt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

# Use the CPU-only PyTorch wheels — the default CUDA build is ~2.5GB and this
# project trains small models on CPU. The CPU wheel is a fraction of the size.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smolgpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
